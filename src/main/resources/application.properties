spring.application.name=songify
spring.datasource.url=jdbc:postgresql://localhost:54320/postgres
spring.datasource.username=user
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
songify.security.jwt-secret=${SONGIFY_JWT_SECRET}
songify.security.jwt-expiration=PT1H
songify.security.allowed-origins=${SONGIFY_ALLOWED_ORIGINS:http://localhost:3000}
songify.security.admin-username=${SONGIFY_ADMIN_USERNAME:}
songify.security.admin-password=${SONGIFY_ADMIN_PASSWORD:}
